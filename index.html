<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#a8d8ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>this week's inspo</title>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root {
  --sky: #a8d8ea; --sky2: #bce3f5; --sky3: #d4eef9;
  --off: #f0f4f8; --off2: #e4ecf2;
  --ink: #1a1208; --ink2: #2e2010; --ink3: #4a5a6a; --ink4: #7a8a9a;
  --card-w: min(340px, 90vw); --card-h: min(480px, 72vh);
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--sky); font-family: 'DotGothic16', sans-serif; color: var(--ink); overflow: hidden; }
.tiger-deco { position: fixed; pointer-events: none; z-index: 0; width: 160px; height: 160px; fill: var(--ink); }
.tiger-tl { top: -8px; left: -8px; }
.tiger-br { bottom: 55px; right: -8px; transform: scaleX(-1); }
#loading-screen { position: fixed; inset: 0; background: var(--sky); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.5rem; z-index: 10; }
#loading-screen.hidden { display: none; }
.loading-title { font-size: 18px; color: var(--ink); letter-spacing: 0.08em; }
.loading-bar-bg { width: 160px; height: 8px; background: var(--off2); border: 2px solid var(--ink); }
.loading-bar-fill { height: 100%; background: var(--ink); animation: loadslide 1.5s ease-in-out infinite; }
@keyframes loadslide { 0% { width:0%; margin-left:0; } 50% { width:60%; margin-left:20%; } 100% { width:0%; margin-left:100%; } }
.loading-text { font-size: 11px; color: var(--ink3); letter-spacing: 0.12em; text-transform: uppercase; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; background: var(--sky); overflow: hidden; }
#app.hidden { display: none; }
.top-bar { width: 100%; max-width: 400px; display: flex; align-items: flex-end; justify-content: space-between; padding: 1rem 1.25rem 0.4rem; position: relative; z-index: 10; }
.wordmark { font-size: 16px; color: var(--ink); line-height: 1.2; letter-spacing: 0.05em; }
.wordmark-sub { font-size: 10px; color: var(--ink3); letter-spacing: 0.08em; margin-top: 1px; }
.top-right { display: flex; align-items: center; gap: 7px; }
.count-pill { font-size: 10px; color: var(--ink3); background: rgba(26,18,8,0.08); border: 2px solid var(--ink); padding: 3px 10px; letter-spacing: 0.05em; }
.filter-wrap { width: 100%; max-width: 400px; padding: 0.3rem 1.25rem; position: relative; z-index: 10; }
.filter-scroll { display: flex; gap: 5px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.filter-scroll::-webkit-scrollbar { display: none; }
.fc { flex-shrink: 0; font-family: 'DotGothic16', sans-serif; font-size: 10px; letter-spacing: 0.06em; padding: 4px 12px; border: 2px solid var(--ink); background: transparent; cursor: pointer; color: var(--ink3); transition: all 0.1s; white-space: nowrap; }
.fc:hover { background: rgba(26,18,8,0.08); }
.fc.on { background: var(--ink); color: var(--sky2); }
.stage { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; position: relative; z-index: 5; }
.deck-wrap { position: relative; width: var(--card-w); height: var(--card-h); }
.ghost { position: absolute; inset: 0; border: 2px solid var(--ink); border-radius: 2px; }
.ghost-1 { background: var(--sky2); transform: rotate(-2.5deg) translateY(10px) scale(0.97); z-index: 1; opacity: 0.55; transition: transform 0.2s; }
.ghost-2 { background: var(--off); transform: rotate(1.5deg) translateY(5px) scale(0.985); z-index: 2; opacity: 0.8; transition: transform 0.2s; }
.ghost-2-inner { position: absolute; inset: 0; padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 8px; overflow: hidden; pointer-events: none; }
.ghost-2-week { font-size: 9px; color: var(--ink3); letter-spacing: 0.08em; background: var(--sky); display: inline-block; padding: 3px 8px; border: 1px solid var(--ink); }
.ghost-2-title { font-size: 13px; color: var(--ink); line-height: 1.4; opacity: 0.7; }
.card { position: absolute; inset: 0; background: var(--off); border: 2px solid var(--ink); z-index: 3; cursor: grab; touch-action: none; will-change: transform; overflow: hidden; display: flex; flex-direction: column; box-shadow: 4px 4px 0 var(--ink); }
.card:active { cursor: grabbing; }
.card.snap { transition: transform 0.4s cubic-bezier(0.34,1.4,0.64,1); }
.card.fly { transition: transform 0.28s cubic-bezier(0.4,0,1,1), opacity 0.24s; }
.card-head { background: var(--sky); border-bottom: 2px solid var(--ink); padding: 0.6rem 1.25rem; display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
.week-tag { font-size: 10px; color: var(--ink2); letter-spacing: 0.08em; }
.card-num { font-size: 10px; color: var(--ink3); }
.card-inner { padding: 1.25rem 1.4rem 1rem; display: flex; flex-direction: column; flex: 1; position: relative; overflow-y: auto; }
.card-label { font-size: 11px; color: var(--ink4); letter-spacing: 0.06em; margin-bottom: 0.6rem; }
.card-title { font-size: clamp(16px, 4.8vw, 19px); color: var(--ink); line-height: 1.5; word-break: keep-all; margin-bottom: 1rem; flex: 1; }
.card-rule { width: 100%; height: 2px; background: repeating-linear-gradient(90deg, var(--ink) 0px, var(--ink) 4px, transparent 4px, transparent 8px); margin-bottom: 0.9rem; flex-shrink: 0; }
.card-text { font-size: 11px; color: var(--ink3); line-height: 1.8; margin-bottom: 0.9rem; }
.card-footer { margin-top: auto; display: flex; flex-direction: column; gap: 9px; }
.tags { display: flex; gap: 5px; flex-wrap: wrap; }
.tag { font-size: 10px; padding: 2px 8px; border: 2px solid; letter-spacing: 0.04em; }
.tag-kpop      { color: #1a4a7a; background: rgba(26,74,122,0.08);  border-color: rgba(26,74,122,0.3); }
.tag-creative  { color: #5a1a8a; background: rgba(90,26,138,0.08);  border-color: rgba(90,26,138,0.3); }
.tag-contents  { color: #7a4a10; background: rgba(122,74,16,0.08);  border-color: rgba(122,74,16,0.3); }
.tag-community { color: #1a6a4a; background: rgba(26,106,74,0.08);  border-color: rgba(26,106,74,0.3); }
.tag-society   { color: #8a1030; background: rgba(138,16,48,0.08);  border-color: rgba(138,16,48,0.3); }
.tag-fashion   { color: #4a4a5a; background: rgba(74,74,90,0.07);   border-color: rgba(74,74,90,0.2); }
.tag-issue     { color: #7a3a10; background: rgba(122,58,16,0.08);  border-color: rgba(122,58,16,0.3); }
.tag-fnb       { color: #8a1a5a; background: rgba(138,26,90,0.08);  border-color: rgba(138,26,90,0.3); }
.tag-source    { color: var(--ink4); background: transparent; border: 2px dashed rgba(26,18,8,0.2); }
.card-link { font-size: 10px; letter-spacing: 0.06em; color: var(--ink4); text-decoration: none; }
.card-link:hover { color: var(--ink); }
.swipe-hint { position: absolute; bottom: 0.9rem; left: 50%; transform: translateX(-50%); font-size: 10px; color: var(--ink4); letter-spacing: 0.12em; display: flex; align-items: center; gap: 7px; pointer-events: none; transition: opacity 0.5s; white-space: nowrap; text-transform: uppercase; }
.hint-dash { width: 12px; height: 2px; background: var(--ink4); }
.bottom { width: 100%; max-width: 400px; padding: 0.6rem 1.25rem 1.4rem; display: flex; flex-direction: column; align-items: center; gap: 0.65rem; position: relative; z-index: 10; }
.lucky-btn { display: flex; align-items: center; gap: 10px; padding: 13px 36px; background: var(--ink); color: var(--sky2); border: 2px solid var(--ink); font-family: 'DotGothic16', sans-serif; font-size: 13px; cursor: pointer; letter-spacing: 0.1em; box-shadow: 4px 4px 0 rgba(26,18,8,0.25); transition: all 0.1s; }
.lucky-btn:active { transform: translate(2px,2px); box-shadow: 2px 2px 0 rgba(26,18,8,0.25); }
.progress-row { display: flex; align-items: center; gap: 10px; width: 100%; }
.prog-bg { flex: 1; height: 6px; background: var(--off2); border: 2px solid var(--ink); overflow: hidden; }
.prog-fill { height: 100%; background: var(--ink); transition: width 0.4s ease; }
.prog-txt { font-size: 10px; color: var(--ink3); letter-spacing: 0.05em; white-space: nowrap; }
#empty-screen { position: fixed; inset: 0; background: var(--sky); display: none; flex-direction: column; align-items: center; justify-content: center; gap: 1rem; padding: 2rem; z-index: 10; }
.empty-title { font-size: 20px; color: var(--ink); letter-spacing: 0.05em; }
.empty-sub { font-size: 11px; color: var(--ink3); text-align: center; line-height: 1.8; }
</style>
</head>

<script>
const TOKEN = "ntn_n99830935543EVA2Oorgc98jdTONzz63g871gSaA7kA4kz";
const DB_IDS = [
  {week:"5월 4주차",  id:"36b25309eb3280bda2e9cf6e2c807d7f"},
  {week:"5월 3주차",  id:"36825309eb3280f8af8ec003759644ab"},
  {week:"5월 2주차",  id:"36825309eb32801e9bcddbdb0797c956"},
  {week:"4월 5주/5월 1주차", id:"36825309eb3280b5b12ccb61a991932f"},
  {week:"4월 3주차",  id:"36825309eb328022b62dc9c120bbdb1b"},
  {week:"4월 2주차",  id:"36825309eb32801db5c9e02b85d1d117"},

  {week:"3월 4주차",  id:"36825309eb328082b259f45b6d9a8910"},
  {week:"3월 3주차",  id:"36825309eb32804c9d5ffb9c0b06bbf0"},
  {week:"3월 2주차",  id:"36825309eb328042bb42fee9f438871e"},
  {week:"3월 1주차",  id:"36825309eb328057a880c1eb4dfe5d01"},
  {week:"2월 4주차",  id:"36825309eb3280a5bca8d826c71e6897"},
  {week:"2월 3주차",  id:"36825309eb3280598cc9ebf76cdc3e80"},
  {week:"2월 2주차",  id:"36825309eb3280288009cb706e681f86"},
  {week:"2월 1주차",  id:"36825309eb3280159263f658fea697ba"},
];
const CAT_CLS = {KPOP:"tag-kpop",CREATIVE:"tag-creative",CONTENTS:"tag-contents",COMMUNITY:"tag-community",SOCIETY:"tag-society",FASHION:"tag-fashion",ISSUE:"tag-issue","F&B":"tag-fnb"};
let allItems=[],deck=[],cur=0,activeFilter="all";
let isDragging=false,startX=0,curX=0,velX=0,lastX=0,lastT=0,hintShown=true;

async function fetchDB(db){
  let items=[],cursor=undefined;
  try{
    while(true){
      const body={page_size:100};
      if(cursor)body.start_cursor=cursor;
      const r=await fetch(`/api/notion`,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({dbId:db.id,token:TOKEN,cursor})
      });
      if(!r.ok)break;
      const d=await r.json();
      for(const page of d.results||[]){
        const p=page.properties;
        const title=p["이름"]?.title?.map(t=>t.plain_text).join("")||"";
        const text=p["텍스트"]?.rich_text?.map(t=>t.plain_text).join("")||"";
        const cats=p["선택"]?.multi_select?.map(s=>s.name)||[];
        const srcs=p["커뮤니티"]?.multi_select?.map(s=>s.name)||[];
        if(title)items.push({week:db.week,title,text,category:cats,source:srcs,url:page.url});
      }
      if(!d.has_more)break;
      cursor=d.next_cursor;
    }
  }catch(e){console.error(e);}
  return items;
}

async function loadAll(){
  let loaded=0;
  const results=await Promise.all(DB_IDS.map(async db=>{
    const items=await fetchDB(db);
    loaded++;
    document.getElementById("loading-text").textContent=`${loaded} / ${DB_IDS.length} weeks loaded`;
    return items;
  }));
  allItems=results.flat().filter(i=>i.title);
  document.getElementById("loading-screen").classList.add("hidden");
  if(!allItems.length){document.getElementById("empty-screen").style.display="flex";return;}
  document.getElementById("count-pill").textContent=`${allItems.length} cards`;
  buildFilters();startDeck(allItems);
  document.getElementById("app").classList.remove("hidden");
}

function buildFilters(){
  const cats=[...new Set(allItems.flatMap(i=>i.category||[]))].filter(Boolean).sort();
  const fr=document.getElementById("filter-row");
  fr.innerHTML=`<button class="fc on" onclick="setFilter('all',this)">all</button>`+cats.map(c=>`<button class="fc" onclick="setFilter('${c}',this)">${c.toLowerCase()}</button>`).join("");
}
function setFilter(cat,el){
  document.querySelectorAll(".fc").forEach(b=>b.classList.remove("on"));
  el.classList.add("on");activeFilter=cat;
  const pool=cat==="all"?allItems:allItems.filter(i=>(i.category||[]).includes(cat));
  if(!pool.length){document.getElementById("empty-screen").style.display="flex";return;}
  document.getElementById("empty-screen").style.display="none";
  startDeck(pool);
}
function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}return b;}
function startDeck(pool){deck=shuffle(pool);cur=0;renderCard();}
function doLucky(){
  const pool=activeFilter==="all"?allItems:allItems.filter(i=>(i.category||[]).includes(activeFilter));
  deck=shuffle(pool);cur=0;renderCard(true);
}
function renderCard(anim){
  const wrap=document.getElementById("deck-wrap");
  const old=wrap.querySelector(".card");if(old)old.remove();
  const item=deck[cur];if(!item)return;
  // 다음 카드 미리보기 ghost-2에 넣기
  const nextItem=deck[(cur+1)%deck.length];
  const g2=wrap.querySelector(".ghost-2");
  if(g2&&nextItem){
    let g2inner=g2.querySelector(".ghost-2-inner");
    if(!g2inner){g2inner=document.createElement("div");g2inner.className="ghost-2-inner";g2.appendChild(g2inner);}
    g2inner.innerHTML=`<span class="ghost-2-week">${nextItem.week}</span><div class="ghost-2-title">${nextItem.title}</div>`;
  }
  const card=document.createElement("div");card.className="card";
  const tagHTML=[...(item.category||[]).map(t=>`<span class="tag ${CAT_CLS[t]||""}">${t}</span>`),...(item.source||[]).map(t=>`<span class="tag tag-source">${t}</span>`)].join("");

  card.innerHTML=`
    <div class="card-head"><span class="week-tag">${item.week}</span><span class="card-num">${cur+1} / ${deck.length}</span></div>
    <div class="card-inner">
      <div class="card-label">this week's inspo ★</div>
      <div class="card-title">${item.title}</div>
      ${item.text?`<div class="card-rule"></div><div class="card-text">${item.text}</div>`:""}
      <div class="card-footer">
        <div class="tags">${tagHTML}</div>

      </div>
    </div>
    ${hintShown?`<div class="swipe-hint" id="swipe-hint"><div class="hint-dash"></div>swipe<div class="hint-dash"></div></div>`:""}
  `;
  if(anim){card.style.opacity="0";card.style.transform="translateX(-50%) scale(0.94)";}
  wrap.appendChild(card);
  if(anim){requestAnimationFrame(()=>requestAnimationFrame(()=>{card.style.transition="transform 0.38s cubic-bezier(0.34,1.3,0.64,1),opacity 0.28s";card.style.opacity="1";card.style.transform="";setTimeout(()=>{card.style.transition="";},400);})  );}
  updateProgress();attachDrag(card);

  if(hintShown){setTimeout(()=>{const h=document.getElementById("swipe-hint");if(h){h.style.opacity="0";setTimeout(()=>h.remove(),500);}hintShown=false;},2600);}
}
function updateProgress(){
  const pct=deck.length>1?Math.round(((cur+1)/deck.length)*100):100;
  document.getElementById("prog-fill").style.width=pct+"%";
  document.getElementById("prog-left").textContent=deck[cur]?.week||"";
  document.getElementById("prog-right").textContent=`${cur+1} of ${deck.length}`;
}
function nextCard(){cur=(cur+1)%deck.length;renderCard();}



function attachDrag(card){
  let startX=0, startY=0, curX=0, dragging=false, moved=false;
  const W=window.innerWidth;

  function px(e){return e.changedTouches?e.changedTouches[0].clientX:e.clientX;}
  function py(e){return e.changedTouches?e.changedTouches[0].clientY:e.clientY;}

  function onStart(e){
    const tag=(e.target||e.srcElement).tagName;
    if(tag==="BUTTON"||tag==="A")return;
    dragging=true; moved=false;
    startX=px(e); startY=py(e); curX=0;
    card.style.transition="none";
  }

  function onMove(e){
    if(!dragging)return;
    const dx=px(e)-startX;
    const dy=py(e)-startY;
    if(!moved&&Math.abs(dy)>Math.abs(dx)){dragging=false;return;}
    moved=true;
    if(e.cancelable)e.preventDefault();
    curX=dx;
    card.style.transform=`translateX(calc(-50% + ${curX}px)) rotate(${curX*0.04}deg)`;
  }

  function onEnd(e){
    if(!dragging)return;
    dragging=false;
    if(!moved)return;
    if(Math.abs(curX)>W*0.28){
      const dir=curX>0?1:-1;
      card.style.transition="transform 0.18s ease-in,opacity 0.15s";
      card.style.transform=`translateX(calc(-50% + ${dir*W*1.4}px)) rotate(${dir*22}deg)`;
      card.style.opacity="0";
      setTimeout(nextCard,180);
    } else {
      card.style.transition="transform 0.4s cubic-bezier(0.25,1,0.5,1)";
      card.style.transform="translateX(-50%)";
      setTimeout(()=>{card.style.transition="";},420);
    }
  }

  card.addEventListener("touchstart",onStart,{passive:true});
  card.addEventListener("touchmove",onMove,{passive:false});
  card.addEventListener("touchend",onEnd,{passive:true});
  card.addEventListener("mousedown",onStart);
  document.addEventListener("mousemove",onMove);
  document.addEventListener("mouseup",onEnd);
}

loadAll();
</script>
</body>
</html>
